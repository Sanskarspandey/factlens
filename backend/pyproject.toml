[project]
name = "factlens-backend"
version = "0.1.0"
description = "Fact Knowledge Layer for extracting, grounding, comparing and reconciling facts across PDFs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "SQLAlchemy>=2.0.32",
    "alembic>=1.13.2",
    "PyMuPDF>=1.24.9",
    "chromadb>=0.5.5",
    "sentence-transformers>=3.0.1",
    "google-genai>=0.1.1",
    "openai>=1.42.0",
    "anthropic>=0.34.0",
    "python-dateutil>=2.9.0",
    "pint>=0.24.3",
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",
    "python-dotenv>=1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "ruff>=0.6.1",
    "mypy>=1.11.1"
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --asyncio-mode=auto"
testpaths = [
    "tests",
]
