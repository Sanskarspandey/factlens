services:
  - type: web
    name: factlens-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://sanskarspandey.github.io", "http://localhost:5173", "http://localhost:3000"]'
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDING_PROVIDER
        value: sentence-transformers
